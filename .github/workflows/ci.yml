name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # Placeholders: de tests die hier draaien hebben geen echte database nodig.
  # Ze controleren dat afgeschermde routes een bezoeker zonder sessie wegsturen.
  # De RLS-tests draaien apart, tegen een echte database (pnpm test:rls).
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

jobs:
  kwaliteit:
    name: Lint, typecheck en unittests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Opmaak controleren
        run: pnpm format:check

      - name: Unittests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright-smoketests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Browsers installeren
        # chromium = desktop, webkit = iOS Safari voor de mobiele tests
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E-tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
